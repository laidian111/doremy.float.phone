name: Build Android Shell APK

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "要加载的自部署站点地址（https://…）"
        required: false
        type: string
  push:
    branches: [main]
    paths: ["android-shell/**", ".github/workflows/android-shell.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    # 可选签名：仓库 Secrets 配置了 SHELL_KEYSTORE_BASE64 等四项时产出已签名 release
    env:
      SHELL_KEYSTORE_BASE64: ${{ secrets.SHELL_KEYSTORE_BASE64 }}
      SHELL_KEYSTORE_PASSWORD: ${{ secrets.SHELL_KEYSTORE_PASSWORD }}
      SHELL_KEY_ALIAS: ${{ secrets.SHELL_KEY_ALIAS }}
      SHELL_KEY_PASSWORD: ${{ secrets.SHELL_KEY_PASSWORD }}
      SHELL_SITE_URL: ${{ inputs.site_url || vars.SHELL_SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 仅用于跑版本一致性检查脚本，不参与 APK 构建。
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Gradle 版本必须与根 build.gradle 里的 AGP 匹配：AGP 8.9 要求
      # Gradle 8.11.1 及以上。这两处是一对，改一处不改另一处必然失败。
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.11.1"

      - name: Decode keystore (optional)
        if: ${{ env.SHELL_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$SHELL_KEYSTORE_BASE64" | base64 -d > /tmp/shell.keystore
          echo "SHELL_KEYSTORE_FILE=/tmp/shell.keystore" >> "$GITHUB_ENV"

      # 版本号分叉是这套壳历史上最难查的一类问题：MainActivity.VERSION 拼进 UA，
      # 网页据此判断壳能力。它和 versionName 一旦不同步，就会出现「装了新版但原生
      # 功能不生效」。在构建前拦一次，比发布后对着日志猜便宜得多。
      - name: Check shell version consistency
        run: node scripts/check-shell-version-consistency.mjs

      # 配了密钥却没配全 → release 会产出未签名 APK，装了也覆盖不上。
      # 提前判掉，避免「构建成功但包不能用」这种假成功。
      - name: Validate signing secrets
        run: |
          missing=0
          for name in SHELL_KEYSTORE_BASE64 SHELL_KEYSTORE_PASSWORD SHELL_KEY_ALIAS SHELL_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::warning::$name 未配置"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ] && [ "$missing" -lt 4 ]; then
            echo "::error::签名 Secret 配置不完整（缺 $missing 项）。四项必须同时配置或同时留空，否则 release 包无法覆盖安装。"
            exit 1
          fi
          if [ "$missing" -eq 4 ]; then
            echo "::notice::未配置签名密钥，本次只产出未签名的 release 包（仅调试用，不能覆盖安装正式版）。"
          else
            echo "签名密钥配置完整，将产出已签名 release APK。"
          fi

      - name: Build APKs
        run: gradle -p android-shell assembleDebug assembleRelease

      # 「构建成功但包没签名」是最容易漏的一种假成功：artifact 能下载，
      # 装到手机上却因为签名不符覆盖不了旧版。配了密钥就必须验出签名。
      - name: Verify release APK is signed
        if: ${{ env.SHELL_KEYSTORE_BASE64 != '' }}
        run: |
          apk=$(ls android-shell/app/build/outputs/apk/release/*.apk | head -n 1)
          echo "检查 $apk"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$bt/apksigner" verify --verbose --print-certs "$apk"
          echo "release APK 签名校验通过"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: float-shell-debug
          path: android-shell/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: float-shell-release
          path: android-shell/app/build/outputs/apk/release/*.apk
